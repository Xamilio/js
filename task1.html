<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея (Обычный jQuery)</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eee;
            padding-top: 20px;
        }

        #gallery-box {
            background: white;
            width: 550px;
            padding: 20px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }

        #large-img {
            width: 500px;
            height: 350px;
            background: #000;
            margin-bottom: 20px;
            /* Чтобы картинка не дергалась при загрузке */
            display: inline-block; 
        }

        .thumb {
            width: 100px;
            height: 70px;
            margin: 5px;
            border: 3px solid transparent;
            cursor: pointer;
            opacity: 0.7;
            /* Важно: добавляем плавность через CSS, так как убрали jQuery UI */
            transition: all 0.3s ease;
        }

        .selected-border {
            border-color: #555;
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>Фотогалерея</h1>

    <div id="gallery-box">
        <img id="large-img" src="https://picsum.photos/id/1011/500/350">
        
        <br>

        <div id="thumbs-list">
            <img class="thumb" src="https://picsum.photos/id/1021/500/350">
            <img class="thumb" src="https://picsum.photos/id/1024/500/350">
            <img class="thumb" src="https://picsum.photos/id/1023/500/350">
            <img class="thumb" src="https://picsum.photos/id/1014/500/350">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script>
        $(document).ready(function(){
            $(".thumb").hover(function() {
                $(this).addClass("selected-border");
            }, function() {
                $(this).removeClass("selected-border");
            });
            $(".thumb").click(function(){
                var link = $(this).attr("src");
                $("#large-img").fadeOut(200, function(){
                    $(this).attr("src", link);
                    $(this).fadeIn(300);
                });
            });

        });
    </script>
</body>
</html>
